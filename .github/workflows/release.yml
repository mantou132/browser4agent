name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: browser4agent-x86_64-linux
            ext: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: browser4agent-aarch64-macos
            ext: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: browser4agent-x86_64-windows
            ext: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/browser4agent${{ matrix.ext }} ${{ matrix.artifact }}${{ matrix.ext }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}${{ matrix.ext }}

  build-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Strip manifest key (Web Store rejects packages containing it)
        run: jq 'del(.key)' extension/manifest.json > extension/manifest.tmp && mv extension/manifest.tmp extension/manifest.json

      - name: Build extension
        run: cd extension && npx extension build --browser chrome,firefox --zip

      - name: Rename zips
        run: |
          mv extension/dist/chrome/*.zip extension/dist/chrome/extension-chrome.zip
          mv extension/dist/firefox/*.zip extension/dist/firefox/extension-firefox.zip

      - uses: actions/upload-artifact@v4
        with:
          name: extension-chrome-zip
          path: extension/dist/chrome/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: extension-firefox-zip
          path: extension/dist/firefox/*.zip

  release:
    needs: [build-rust, build-extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**/*

  publish-chrome:
    needs: build-extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension-chrome-zip

      - uses: wdzeng/chrome-extension@v1
        with:
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          zip-path: '*.zip'
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}

  publish-edge:
    needs: build-extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension-chrome-zip

      - uses: wdzeng/edge-addon@v2
        with:
          product-id: ${{ secrets.EDGE_PRODUCT_ID }}
          zip-path: '*.zip'
          api-key: ${{ secrets.EDGE_API_KEY }}
          client-id: ${{ secrets.EDGE_CLIENT_ID }}

  publish-firefox:
    needs: build-extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension-firefox-zip

      - uses: wdzeng/firefox-addon@v1
        with:
          addon-guid: ${{ secrets.FIREFOX_ADDON_GUID }}
          xpi-path: '*.zip'
          jwt-issuer: ${{ secrets.FIREFOX_JWT_ISSUER }}
          jwt-secret: ${{ secrets.FIREFOX_JWT_SECRET }}
